name: Build Web App to Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Initialize Cordova App & Build APK
        run: |
          cordova create cordova_app com.worktracker.app "WorkTracker"
          cp index.html cordova_app/www/index.html
          cd cordova_app
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-tracker-html-apk
          path: cordova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
